# Payload rewriting rules (CLIProxyAPI-style payload rules for Bifrost).
REPO=koreapyj/bifrost-plugin-payload
REF=main
PACKAGE=.
# The embedded management UI assets (engine.wasm.gz, wasm_exec.js, the web
# bundle) are not committed in the plugin repository; build them first.
PREBUILD='sh ui/build.sh all'
SMOKE_CONFIG='{"rules": []}'
